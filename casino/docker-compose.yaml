services:
  banking-app:
    build: .
    container_name: banking-app
    ports:
      - "8080:8080"
    depends_on:
      - banking-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banking-db:5432/banking
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
  
  game-app:
    build: .
    container_name: game-app
    ports:
      - "8081:8080"
    depends_on:
      - game-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://game-db:5432/game
      SPRING_DATASOURCE_USERNAME: game
      SPRING_DATASOURCE_PASSWORD: game
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true

  banking-db:
    image: postgres:17
    container_name: banking-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    volumes:
      - banking-db-data:/var/lib/postgresql/data

  game-db:
    image: postgres:17
    container_name: game-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    volumes:
      - game-db-data:/var/lib/postgresql/data

volumes:
  banking-db-data:
  game-db-data: